[project]
name = "local-ai-interviewer-backend"
version = "0.1.0"
description = "本地化智能面试官 - 后端服务"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "chromadb>=0.5.0",
    "ollama>=0.3.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "aiofiles>=24.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
